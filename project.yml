# XcodeGen 工程描述文件
#
# 备用方案：如果直接打开 EyeCard.xcodeproj 失败（例如 Xcode 版本低于 16，
# 不支持「文件系统同步目录」这种现代工程格式），可以在 Mac 上用它重新生成工程：
#
#   brew install xcodegen
#   cd ios
#   xcodegen generate
#
# 生成的 EyeCard.xcodeproj 与本目录自带的那个等价。

name: EyeCard
options:
  bundleIdPrefix: com.eyecard.glasses
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EyeCard:
    type: application
    platform: iOS
    sources:
      - path: EyeCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyecard.glasses.ios
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
